# claude-workflow configuration
#
# If you are Claude and these values are blank or unset:
# Scan the project and fill them in before proceeding with any workflow skill.
# Detection hints are in the comments for each field.
# After filling in values, confirm with the user before writing the file.

# What this project is to the harness.
#
#   client       (default) runs the pipeline — plans, registry, bugs, worktrees.
#   coordinator  runs NO pipeline of its own. It oversees projects that do, and
#                gets one capability: filing work into theirs. Declaring this
#                changes what install.sh writes here — see docs/coordinator.md
#                before setting it, and list the projects under `coordinates:`.
role: "client"

# Build command — run to compile/build the project.
# Detect from: package.json "scripts.build", Makefile targets, *.csproj / *.slnx (use "dotnet build <file>"), CMakeLists.txt
build_command: ""

# Test command — run to execute the full test suite.
# Detect from: package.json "scripts.test", jest.config.*, *.csproj / *.slnx, pytest.ini, go.mod
#
# .NET: a *.csproj takes `dotnet test <file>`, but a SOLUTION takes
# `dotnet test --solution <file>`. Passing a solution positionally fails with
# "Specifying a solution for 'dotnet test' should be via '--solution'." and runs
# nothing. Only one consumer reads this key — lv-test's auto-test agent, handed
# it as "Test command:" — so a wrong value fails quietly: the agent either
# adapts on its own or reports a FAIL that looks like the criterion's fault
# rather than the config's (WFI-035).
test_command: ""

# What validates the tree produced when /lv-test merges `release` into a feature
# branch, just before that tree is pushed to `release` (lv-post-merge-check.sh).
#
#   full   (default)  build_command, then test_command, whole and unfiltered.
#   build             build_command only — the pre-9.8 behavior.
#
# `full` costs one suite run per plan exit, paid by the plan whose merge broke
# something. `build` saves that and moves the discovery to /lv-deploy, which is
# hours later, after the plan is complete and its worktree destroyed, and after
# a human has been asked to approve the promotion.
#
# client-a, 2026-09-18: PLN-283 and PLN-284 were each green alone and
# together broke one CLI test — PLN-283 changed what the ticket folder holds,
# PLN-284's path asserted the old shape. Both compiled, so the build check
# passed both. Three deploys found it, one 20-minute suite each, and DEPLOY
# parked `stuck` with fifteen completed plans behind it.
#
# Set `build` only with a reason written beside it — a suite too slow to run at
# every plan exit, and an accepted cost of finding merge breaks at deploy.
postMergeCheck: full

# External services the E2E suite needs, checked by lv-preflight.sh before
# /lv-release runs the suite. One name, one check, joined by the FIRST ':'.
# A check starting http:// or https:// is fetched; anything else is run as a
# shell command and passes on exit 0.
#
#   e2ePrereqs:
#     - "dev issuer:http://localhost:8084/.well-known/openid-configuration"
#     - "database:pg_isready -q -h localhost"
#
# Leave it out when the suite is self-contained — the check is then a no-op.
# Declare one for every service whose absence makes tests fail: a red suite is
# only evidence against the commits if the suite could have passed. client-e
# lost a release to 9 login tests timing out because client-c's local dev
# issuer was down, on a merge with no src/ changes at all (WFI-028). Prefer a
# probe that proves the service is SERVING (a discovery endpoint) over one that
# proves a socket is open.
e2ePrereqs: []

# Flag to run a single test by name or pattern.
# Common values: "--grep" (mocha/jest), "--filter" (dotnet VSTest), "-k" (pytest), "-run" (go)
#
# The three filter keys below are VSTest syntax by default. A .NET project on
# Microsoft.Testing.Platform rejects `--filter` outright — see testFilterStyle
# for the MTP equivalents, and set these to match your runner (WFI-038).
test_filter_flag: ""

# Filter to exclude e2e tests (used by implement/verify — fast feedback without a running server).
# e.g., '--filter "FullyQualifiedName!~E2E"' (dotnet VSTest),
#       '--filter-not-namespace "*E2E*" --ignore-exit-code 8' (dotnet MTP),
#       '--grep "^(?!.*E2E)"' (mocha)
#
# The OUTER single quotes above are YAML, not part of the value — they are there
# because the value contains double quotes. What reaches the command line is the
# bare flags: `dotnet test --filter-not-namespace "*E2E*" --ignore-exit-code 8`.
# Quote the whole value again on the command line and the flags fuse into one
# unrecognised argument: the filter is ignored, the full suite runs, and the run
# fails on an e2e test the filter existed to exclude (WFI-088, WFI-090).
test_exclude_e2e: ""

# Filter to run only e2e tests (used by lv-test — human tester has the app running).
# e.g., '--filter "FullyQualifiedName~E2E"' (dotnet VSTest),
#       '--filter-namespace "*E2E*" --ignore-exit-code 8' (dotnet MTP),
#       '--grep E2E' (mocha)
test_only_e2e: ""

# Source directories — the implementer is allowed to edit files in these paths.
# Detect from: project structure (src/, lib/, app/, tests/, spec/, etc.)
source_dirs:
  - ""

# Namespace or module convention used in this project.
# Detect from: existing source files — look at the top-level namespace/module declarations.
# e.g., "App.[Project].[Folder]" for C#, "com.example.[module]" for Java — leave blank if N/A
namespace_convention: ""

# Free-text note about project conventions the reviewer/verifier should know.
# e.g., "Use repository pattern for data access. No direct DbContext in controllers."
conventions_note: ""

# Solution or project file (used in build/test commands if applicable).
# Detect from: *.slnx, *.sln, *.csproj, package.json, pyproject.toml, go.mod in the root
solution_file: ""

# Project slug — short identifier used to namespace Docker compose projects
# (e.g., "app-pln004"). Must be unique per client to avoid container collisions
# between projects sharing a Docker daemon.
# Detect from: directory name or repo name (e.g., "app" for /Users/you/dev/app).
project_slug: ""

# Production deploy references — shown in /lv-deploy completion message.
# Leave blank if the project has no production deployment / CI pipeline.
#   production_logs_url: URL to deploy logs (e.g., GitHub Actions page)
#   production_url:      URL of the live site
production_logs_url: ""
production_url: ""

# Local dev environment — Docker-based auto-start on implement commits (optional).
# If set, a 60-minute idle timer starts on every implement( commit and on manual start.
# The container stops automatically when the timer expires.
# Detect from: docker-compose.yml or docker-compose.yaml in the project root.
#   local_start_command:  start without rebuilding  — e.g. "docker-compose up -d"
#   local_deploy_command: start and rebuild          — e.g. "docker-compose up --build -d"
#   local_stop_command:   stop the environment       — e.g. "docker-compose stop"
# Leave all three blank to skip local env management.
local_start_command: ""
local_deploy_command: ""
local_stop_command: ""

# Tiered test gating (BRF-080).
# lv-verify reads testScopes to build a test-filter expression for feature-branch
# runs; lv-release runs the full suite with no filter (aggregation guarantee).
#
# testScopes — map a category name to a list of test FullyQualifiedName substrings
# (dotnet) or regex fragments (mocha/jest) understood by {{test_filter_flag}}.
# Pick names that describe the change domain, not the test mechanism.
#
# testMappings — when files matching a glob change on the feature branch, the listed
# scopes are added to the verify filter automatically. Planner-declared categories
# (plan.md `## Test Scope`) and testScopeMandatory are always unioned in.
#
# Leave these blocks empty to disable tiered gating — verify falls back to the
# full suite (backward-compatible behavior).
#
# testFilterStyle — how lv-test-scope.sh renders the filter.
#   auto    (default) vstest, unless the project is detected as Microsoft.
#           Testing.Platform (global.json `runner`, or a csproj setting
#           TestingPlatformDotnetTestSupport), in which case: mtp
#   vstest  emit FullyQualifiedName~X expressions behind test_filter_flag
#   mtp     emit repeated --filter-class, plus --ignore-exit-code 8
#   none    never emit a filter — always run the full suite
#
# MTP does not recognise VSTest's --filter in native mode: it prints its own
# help, reports "Zero tests ran" and exits 1. It has its own filter flags
# instead, confirmed against real `dotnet test --solution` runs on .NET 10 /
# xUnit v3:
#   FullyQualifiedName~X   ->  --filter-method '*X*'
#   a class                ->  --filter-class 'Ns.Class'
#   a namespace            ->  --filter-class 'Ns*'  /  --filter-namespace 'Ns*'
#   negation               ->  --filter-not-class / --filter-not-namespace
# Repeating a flag ORs the values.
#
# --ignore-exit-code 8 belongs with a filtered MTP run and nowhere else:
# filtering across a solution makes every project with zero matching tests exit
# 8, so a run whose selected tests all passed still reports failure. On an
# UNFILTERED run, exit 8 means the suite really found no tests — a genuine
# failure that must stay one. That is why it cannot live in test_command.
testFilterStyle: auto
testScopes: {}
#   unit:
#     - MyApp.Core.Tests
#     - MyApp.Web.Tests
#   integration:
#     - MyApp.Web.Tests.AuthTests
#   e2e-smoke:
#     - MyApp.E2E.Tests.HomePageTests
#   e2e-all:
#     - MyApp.E2E.Tests

testMappings: []
#   - glob: "src/Core/**"
#     scopes: [unit]
#   - glob: "src/Web/**"
#     scopes: [unit, integration]
#   - glob: "tests/E2E/**"
#     scopes: [e2e-all]

testScopeMandatory: []
#   - e2e-smoke

# Auto-test growth.
# When enabled, /lv-test offers an [a] choice per criterion: a sonnet agent
# writes (or locates) an automated test, runs it, and commits it to the
# feature branch on pass. The test ships with the PR, so future plans that
# touch the same area get the regression check for free.
#
# Every outcome is appended to logFile (default plans/auto-test-log.md):
#   - ### Realized — agent succeeded. lv-spec reads this during planning to
#     catch criteria that should have been classified automated up front.
#     lv-implement reads it for style reference when writing tests.
#   - ### Candidates — agent couldn't produce a passing test. Manual fallback
#     runs for this criterion; the candidate is reviewed later.
#
# The log is the feedback loop: every [a] you hit is a signal that the plan
# missed an automation opportunity. Reviewing the log informs future specs.
autoTestGrowth:
  # On by default: a criterion checked once by a human is not a regression
  # test, and every criterion converted here runs in every later verify.
  enabled: true
  agentModel: sonnet
  logCandidatesOnFail: true
  logFile: plans/auto-test-log.md

# ── Shared test state ───────────────────────────────────────────────────────
# Changes that switch the scope filter off entirely.
#
# A filtered run answers "do the selected tests pass?" — which stops being the
# same question as "did this break anything?" the moment the change is to
# something the other tests SHARE: a collection fixture, a test base class, a
# seeded-database helper, an assembly-wide DI container. Those failures depend
# on what else ran and in what order, so a subset run passes while the full
# assembly fails. client-a merged exactly that regression to develop with a
# green verify and a green test gate (WFI-123).
#
# List the files whose blast radius is the whole assembly. A diff touching one
# of them runs the full suite, whatever the plan's `## Test Scope` says. Empty
# is the pre-6.3.1 behavior: filter always honoured.
testScopeFullSuiteGlobs: []
#   - "tests/**/Fixtures/**"
#   - "tests/**/*Fixture.cs"
#   - "tests/**/*CollectionDefinition.cs"
#   - "tests/**/TestBase.cs"

# ── Test account ────────────────────────────────────────────────────────────
# How a FRESH test container gets an account the acceptance criteria can sign
# in as, and what to tell the tester.
#
# A container built from a feature branch starts empty, and an app worth
# testing usually refuses to seed a default password (rightly — a default
# password on a reachable host is a standing compromise). The tester then gets
# a URL and no way in, and every criterion behind the login is unreachable.
# client-a hit exactly that and stalled a run at criterion 5 of 5 (WFI-072);
# the worse cost is the runs before it, where criteria behind a login were
# recorded as skipped or passed by sessions that could not have executed them.
#
#   test_account_command: run by lv-docker-up.sh once the container is healthy,
#                         with FEATURE_PORT and COMPOSE_PROJECT_NAME exported.
#                         Must be idempotent — it runs on every start. e.g.
#                         "docker exec -e APP_OWNER_PASSWORD='...' \
#                          ${COMPOSE_PROJECT_NAME}-web-1 dotnet /app/App.dll --seed-owner"
#   test_account_note:    one line handed to the tester, credentials included.
#                         Say what the login form actually wants: an app whose
#                         seeder sets a username but whose sign-in looks up by
#                         email will reject the username, and the tester has no
#                         way to know that. e.g.
#                         "sign in with dev@example.com / <password> (email, not username)"
#
# Do NOT append `|| true` to test_account_command. An idempotent seeder usually
# exits non-zero on the already-provisioned path ("an owner already exists"),
# and swallowing that also swallows a real failure. lv-docker-up.sh already
# treats a non-zero exit as a warning and brings the app up regardless, so the
# already-provisioned case costs one line of noise and a genuine failure stays
# visible (WFI-074).
#
# Leave both blank if the app needs no account to test.
test_account_command: ""
test_account_note: ""

# ── Device testing (phones, tablets) ────────────────────────────────────────
# What `lv-docker-up.sh --tunnel` runs to put an HTTPS origin in front of the
# container.
#
# A LAN URL is not enough, and the way it fails gives no clue. A session cookie
# set `Secure` is stored on http://localhost — browsers treat localhost as a
# trustworthy origin — and silently dropped on http://<lan-ip>. The phone POSTs
# the login, gets HTTP 200, discards the cookie and reloads signed out, with no
# error anywhere. client-a's PLN-006 had a one-handed-phone criterion that
# was untestable for this reason until someone tunnelled it by hand (WFI-113).
#
# The default is a cloudflared quick tunnel: no account, no config, a random
# https://*.trycloudflare.com hostname, torn down by lv-docker-down.sh. Install
# it with `brew install cloudflared`. Override for ngrok, a named tunnel, or a
# local reverse proxy with a dev certificate. $FEATURE_PORT is exported.
#
# Only ever started when --tunnel is passed: it publishes a development build
# to a public URL, which is a decision, not a default.
tunnel_command: "cloudflared tunnel --url http://localhost:$FEATURE_PORT"

# ── Project profile ─────────────────────────────────────────────────────────
# How much governance this project's real-world stakes currently justify.
#
# Not a runtime switch — nothing below reads this to silently change gate
# behavior. It is the recorded reason specApproval.mode, manualTestGate and
# orchestrator.autonomy are set the way they are, and the checklist to work
# through when that reason stops being true. Read docs/project-profile.md
# before adding one.
#
#   pre-launch   No real users yet, or negligible ones. A bad unattended call
#                costs a redeploy or a rollback, not an incident. Recommends
#                specApproval.mode: verdict, manualTestGate.blockOnCosmetic:
#                false, standing autonomy through production-push.
#   governed     Real users depend on this. Recommends specApproval.mode:
#                gate, manualTestGate.blockOnCosmetic: true, autonomy scoped
#                to release/deploy at most — production-push stays attended.
#
# Leave unset until you've deliberately picked one — lv-profile.sh --show
# refuses rather than assume a tier for you.
#
#   scripts/lv-exec.sh lv-profile.sh --show     tier, reason, who, when
#   scripts/lv-exec.sh lv-profile.sh --check    drift against the table above
projectProfile: {}
#   tier: pre-launch
#   reason: "No real users yet."
#   set_by: "Marc Blais"
#   set_on: 2026-09-10

# ── Manual-test gate ────────────────────────────────────────────────────────
# ── Test ids ────────────────────────────────────────────────────────────────
#
# How this project numbers the test ids in a plan's `## Tests` table. Read by
# lv-test-id-next.sh, which is what /lv-spec asks for the next free id.
#
# Getting this wrong is not cosmetic. Under the wrong scope the script's advice
# is confidently backwards: a `flat` reading of a per-plan project reports every
# sibling plan as a collision and tells the planner to renumber tests that are
# already written and passing (client-b WFI-024 — ~70 false collisions on a
# replan whose seven tests were green on its own branch).
testIds:
  # flat      one sequence for the whole project: T70, T71, T72 … Every plan
  #           and every landed test file is in scope, and a repeat is a
  #           collision. This is the default, and it is what the collision
  #           check exists for (client-d WFI-010: three plans on one range,
  #           nineteen references renumbered by hand).
  #
  # per-plan  each plan numbers its own tests from T1. A sibling plan holding
  #           T1 is the convention working, not a collision. The only clash
  #           that can exist is one plan using an id on two rows.
  #
  # Declare what the project ACTUALLY does. Converting between them is a
  # renumbering exercise across every plan and test file, not a config change.
  scope: flat

  # The letter the ids carry, and where landed tests live.
  prefix: T
  dir: tests

# When an unattended /lv-test run stops for a human. See projectProfile above
# for what tier recommends blockOnCosmetic: true vs false.
#
# The rule used to be "stop if any `#### Manual` criterion remains". Every plan
# has some, so every plan stopped. But the criteria are not evenly spread: plans
# that render nothing to a human are almost entirely shell assertions wearing a
# manual label, while browser-UI plans are genuinely irreducible. The gate keys
# on the surface the diff touches — which the planner does not control when
# classifying criteria — rather than on how many criteria were written.
#
# A gate opens only when ALL of these hold. `lv-manual-gate.sh` decides;
# /lv-test does not second-guess it.
manualTestGate:
  # 1. The diff must touch a rendering surface below.
  requireRenderingSurface: true

  # 2. At least this many unresolved (eyes:*) criteria must remain.
  minEyesCriteria: 1

  # 3. Whether an (eyes:cosmetic) criterion alone can hold a merge. Off: a
  #    cosmetic failure files a BUG-NNN and the plan ships.
  blockOnCosmetic: false

  # Globs that count as "a human can see this". Empty ⇒ every plan can gate.
  # `/**/` spans any number of directories; a bare `*` stops at a separator.
  renderingSurfaces:
    - "src/**/wwwroot/**"
    - "src/**/*.razor"
    - "src/**/Components/**"
    - "src/**/*.tsx"

# ── Spec approval ───────────────────────────────────────────────────────────
# Who decides a drafted plan may be built.
#
#   gate     every plan parks as a `spec-approval` gate and waits for a human.
#            The pre-3.0 behavior, and the default until WFI-006.
#   verdict  the default. The architecture review runs unattended and its
#            VERDICT is the gate: Approved / Approved-with-notes advances to
#            `ready`, Blocked goes round the fix loop, and only a plan still
#            Blocked after maxReviewRounds — or tagged with one of gateTags
#            (security by default) — parks for a human.
#
# `verdict` exists because the human decision was measured and found empty: in
# one 16-plan program the review found Critical findings in 8 of 8 plans, so the
# question was never "is this good?" but "proceed with the fix loop the reviewer
# just specified" — a state transition wearing a judgment call's clothes. Every
# plan converged in 2 rounds.
#
# Read `docs/orchestrator.md` before switching. In `verdict` mode nothing else
# reads the plan before it is built, so the cross-plan consistency pass is the
# compensating control — leave it on. See projectProfile above for which mode
# each governance tier recommends.
specApproval:
  mode: verdict

  # Blocked rounds allowed before parking as a `spec-stuck` gate. A plan needing
  # a 4th round has a problem the reviewer cannot articulate, which is exactly
  # when a human is worth interrupting.
  maxReviewRounds: 3

  # Plans carrying any of these tags always gate, whatever the verdict.
  gateTags:
    - security

# ── Prior work ──────────────────────────────────────────────────────────────
# Before a builder starts, lv-prior-work.sh looks for a commit already on
# develop that names this plan (or the bug it consumes) and touches something
# other than pipeline bookkeeping. If it finds one, the plan parks on a gate: a
# human decides whether to accept that code or revert it and build per plan.md.
#
# `plans/`, `bugs/`, `briefs/` and `.claude/` are always treated as
# bookkeeping. `ignorePaths` adds the places THIS project talks about a plan
# without implementing it. client-a's drive/exchange/ is a cross-machine
# message log, so every bug relayed from the remote machine arrived as a commit
# naming its bug ID — three plans in one session each opened a gate over a note
# and each cost a human round trip (WFI-193).
#
# Entries are path PREFIXES from the repository root, not globs — write the
# trailing slash for a directory. The four built-ins are never removed, so this
# cannot turn the gate off; a commit that also touches real code still reports.
priorWork:
  ignorePaths: []
    # - "drive/exchange/"   # relayed messages about a bug, not a fix for one
    # - "docs/decisions/"   # an ADR naming a plan is a record, not an implementation

# ── Cross-project reports ───────────────────────────────────────────────────
# Who this project can file into, and who can file into it. Each entry is
# "name:absolute-path" — the path is a LOCAL checkout of a project running this
# harness, because filing runs that project's own lv-bug-new.sh so the ID comes
# from its counter and the report lands where its own /lv-spec already looks.
# Nothing scans for these; a human declares them. See
# docs/cross-project-reports.md and docs/coordinator.md.
#
# All three are optional and all default to empty.
#
#   dependencies:  projects THIS one builds against. lv-dep-bug.sh files a bug
#                  or capability request INTO one of them.
#   dependents:    projects that build against THIS one. lv-dep-notify.sh
#                  announces a change here OUT to them.
#   coordinates:   projects this one oversees (role: coordinator only).
#                  lv-dep-notify.sh --kind request files work DOWN into them.
#                  Read together with dependents:, so a project that is both
#                  depended upon and a coordinator keeps all of its targets.
#
# dependencies: []
#   - "client-c:/Users/you/dev/client-c"
# dependents: []
#   - "client-e:/Users/you/dev/client-e"
# coordinates: []
#   - "client-f:/Users/you/dev/client-f"

# ── Orchestrator ────────────────────────────────────────────────────────────
# Dispatches unattended workers by REGISTRY state so the pipeline runs from one
# terminal instead of four. Routing is deterministic bash — only the workers
# cost tokens.
#
#   scripts/lv-exec.sh lv-orchestrate.sh --daemon        continuous
#   scripts/lv-exec.sh lv-orchestrate.sh --sweep         one pass
#   scripts/lv-exec.sh lv-orchestrate.sh PLN-097         drive one plan
#   scripts/lv-exec.sh lv-orchestrate.sh --sweep --dry-run   see the plan first
#
# Genuine judgment calls (spec approval, `#### Manual` criteria, release/deploy)
# never run unattended — they park as gates and wait for /lv-attend.
orchestrator:
  # OFF by default. Run --sweep --dry-run a few times before turning this on:
  # workers run with --dangerously-skip-permissions.
  enabled: false

  # Seconds between daemon sweeps.
  sweep_interval: 60

  # Live workers allowed per role. implement > 1 means concurrent worktrees;
  # keep spec at 1 so two specs can't race on the same brief.
  #
  # COUNT TEST RUNS, NOT WORKERS. These caps bound the workers; each implement
  # and verify worker then runs the project's build and test commands, and
  # lv-verify fans out to several agents that each run one. The defaults below
  # (2 + 2 + 1) reached nine simultaneous runs of one test assembly on a
  # client-a machine — load 27 on 12 cores — and two full-suite runs were
  # killed by their own 600s timeout without finishing (WFI-222). If a project's
  # suite takes minutes rather than seconds, halve implement and verify: a
  # timed-out run yields no verdict at all, so a slower pipeline that finishes
  # is strictly faster than a parallel one that does not.
  max_concurrent:
    spec: 1
    implement: 2
    verify: 2
    test: 1
    consistency: 1

  # Model tier per role — the whole point is that grunt work runs cheap.
  # spec gets the expensive model because planning is where judgment lives.
  models:
    spec: opus
    implement: sonnet
    verify: sonnet
    test: haiku
    consistency: sonnet

  # Cross-plan consistency pass. When a plan with declared Deps reaches `ready`,
  # a worker reads it plus its whole dependency closure and checks only the
  # claims BETWEEN plans: consumed APIs exist with the assumed shape, required
  # entities have a provisioning path somewhere, no two plans define the same
  # artifact incompatibly.
  #
  # No other role owns this. Every review is scoped to one plan, so two plans
  # can each be correct alone and still contradict each other — and the same
  # missing-provisioning-path defect appeared in 7 of 16 plans of one program
  # without any per-plan review being able to see it was a pattern.
  #
  # It runs BEFORE implement: caught while both plans are documents it is an
  # amendment; caught after one is built it is a migration. It is also the
  # compensating control for specApproval.mode: verdict — turning that on while
  # turning this off leaves nothing reading across plans at all.
  consistency_pass: true

  # Loop breaker. A plan launched this many times WITHOUT FORWARD PROGRESS
  # parks as a `stuck` gate instead of burning tokens forever.
  #
  # Forward progress = the registry state moved, or progress.md's `## Steps`
  # checklist gained a tick. That distinction is what keeps a clean resume of a
  # long plan from spending the same budget as an active⇄verify thrash — do not
  # raise this to work around a plan that parks mid-build. If that happens, the
  # implementer is not calling lv-progress-tick.sh, and the fix is there.
  max_attempts_per_plan: 3

  # Hard ceiling on worker launches per hour, across all roles. The backstop
  # for a runaway pipeline.
  max_spawns_per_hour: 20

  # Stand-down threshold for launches that die BEFORE their worker starts.
  # This counts the daemon, not the plan: when the launch itself fails, the
  # artifact is fine and the next one will fail identically, so after this
  # many consecutive failures the daemon exits 4 rather than draining its
  # queue into skips. A single successful spawn clears the count. These
  # failures never cost an artifact an attempt.
